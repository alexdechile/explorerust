[package]
name = "explorerust"
version = "0.1.0"
edition = "2021"
description = "A modern dual-interface file explorer for Linux"

[[bin]]
name = "explorerust"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
egui_extras = "0.28"

# TUI
ratatui = "0.28"
crossterm = { version = "0.27", features = ["event-stream"] }

# Args
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Filesystem
walkdir = "2"
notify = "6"

# System paths
dirs = "5"

# Markdown
pulldown-cmark = "0.12"

# Syntax highlighting (pure Rust, no C deps)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Theme detection
dark-light = "1"

# Open with default app
open = "5"

# Find binaries in PATH
which = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Unix permissions
nix = { version = "0.29", features = ["fs", "user"] }

# Error handling
anyhow = "1"

# Thread-safe channels
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
